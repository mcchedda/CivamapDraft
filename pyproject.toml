[project]
name = "civamapdraft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastembed>=0.9.1",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "qdrant-client>=1.20.0",
    "streamlit>=1.67.0",
]

[project.scripts]
civamapdraft = "civamapdraft:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
